<!DOCTYPE html>
<html lang="pl">
<head>
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pragma_theme') || 'light');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragma - Twoje konto</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="shortcut icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#2b2a27">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <svg class="pragma-backdrop" width="640" height="640" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
            <linearGradient id="pragmaBackdropGrad" x1="15%" y1="0%" x2="85%" y2="100%">
                <stop offset="0%" stop-color="#9a9184"/>
                <stop offset="100%" stop-color="#3f3c35"/>
            </linearGradient>
        </defs>
        <path transform="rotate(-18 50 50)" fill="url(#pragmaBackdropGrad)" d="M50,8 C74,32 88,48 88,63 A38,38 0 1,1 12,63 C12,48 26,32 50,8 Z"/>
    </svg>

    <!-- Ten sam górny pasek (ikonka profilu + saldo kredytów) co index.html —
         wcześniej brakowało go na tej stronie, przez co całość sprawiała
         wrażenie osobnej, niespójnej aplikacji mimo tej samej karty/kolorów
         pod spodem (zgłoszone 2026-08-18). Zawsze widoczny na tej stronie,
         bo dotarcie tu w ogóle wymaga zalogowania (patrz getSession() niżej). -->
    <a id="userMenuBtn" href="account.html" style="display:flex;" data-i18n-aria-label="account_aria_label" aria-label="Twoje konto">👤</a>
    <div id="creditBalance" class="credit-balance" style="display:flex;" data-i18n-aria-label="credit_balance_label" aria-label="Stan kredytów">
        <span aria-hidden="true">💰</span><span id="creditBalanceValue" aria-live="polite">0</span>
    </div>

    <div class="card" style="max-width:400px; width:100%;">
        <a href="index.html" class="back-link" data-i18n="account_back">← Wróć do Pragmy</a>
        <h2 data-i18n="account_title">Twoje konto</h2>

        <div id="accountLoading">
            <p style="color:var(--ink-soft); margin:0;" data-i18n="loading">Ładowanie...</p>
        </div>

        <div id="accountContent" style="display:none;">
            <p style="margin:0 0 10px 0;"><span data-i18n="account_logged_in_as">Zalogowano jako:</span><br><strong id="accountEmail"></strong></p>
            <button id="logoutBtn" type="button" data-i18n="btn_logout">Wyloguj</button>

            <div style="margin-top:16px;">
                <label for="languageSelect" style="display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px;" data-i18n="language_label">Język aplikacji</label>
                <select id="languageSelect" style="width:100%; padding:11px 12px; border:var(--border-w) solid var(--card-border); border-radius:var(--radius-sm); font-size:16px; font-family:inherit; color:var(--ink); background:var(--input-bg);"></select>
            </div>

            <div style="margin-top:16px;">
                <label for="themeSelect" style="display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px;" data-i18n="theme_label">Motyw</label>
                <select id="themeSelect" style="width:100%; padding:11px 12px; border:var(--border-w) solid var(--card-border); border-radius:var(--radius-sm); font-size:16px; font-family:inherit; color:var(--ink); background:var(--input-bg);">
                    <option value="light" data-i18n="theme_light">Jasny</option>
                    <option value="dark" data-i18n="theme_dark">Ciemny</option>
                </select>
            </div>

            <div style="margin-top:16px;">
                <label for="usernameInput" style="display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px;" data-i18n="username_label">Nazwa użytkownika</label>
                <input type="text" id="usernameInput" maxlength="24" style="margin:0;">
                <button id="saveUsernameBtn" type="button" data-i18n="btn_save_username" style="margin-top:8px;">Zapisz nazwę</button>
                <div id="usernameStatus" style="font-size:13px; margin-top:4px;"></div>
            </div>

            <div style="text-align:center; margin-top:14px;">
                <a href="#" id="changePasswordLink" style="font-size:13px;" data-i18n="link_change_password">Zmień hasło</a>
            </div>
            <div id="changePasswordForm" style="display:none; margin-top:10px;">
                <input type="password" id="newPassword" data-i18n-placeholder="placeholder_new_password" placeholder="nowe hasło (min. 6 znaków)" autocomplete="new-password">
                <button id="changePasswordBtn" type="button" data-i18n="btn_save_password">Zapisz nowe hasło</button>
            </div>
            <div id="accountStatus" style="margin-top:10px; font-size:13px;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="i18n.js"></script>
    <script>
        applyTranslations();

        const SUPABASE_URL = 'https://daulljwdoerclborpctb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IitZfwgddsrCIo3iepG0Fg_CVqN-GBd';

        function translateAuthError(err) {
            const msg = (err && err.message) || String(err);
            if (msg.includes('Password should be at least')) return t('err_password_min');
            return msg;
        }

        function populateLanguageSelect() {
            const select = document.getElementById('languageSelect');
            select.innerHTML = '';
            SUPPORTED_LANGUAGES.forEach((lang) => {
                const opt = document.createElement('option');
                opt.value = lang.code;
                opt.innerText = lang.name;
                if (lang.code === getCurrentLanguage()) opt.selected = true;
                select.appendChild(opt);
            });
        }

        let sb = null;
        try {
            if (typeof supabase === 'undefined') throw new Error('Biblioteka Supabase nie wczytała się.');
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error(e);
        }

        if (!sb) {
            document.getElementById('accountLoading').innerHTML =
                '<p class="status-err">' + t('account_load_error') + '</p>';
        } else {
            // Ta podstrona wymaga zalogowania — jeśli sesji nie ma (albo wygaśnie),
            // od razu wracamy na stronę główną.
            sb.auth.onAuthStateChange((event, session) => {
                if (!session) {
                    window.location.href = 'index.html';
                }
            });

            sb.auth.getSession().then(async ({ data: { session } }) => {
                if (!session) {
                    window.location.href = 'index.html';
                    return;
                }
                refreshCreditBalance(sb, session.user.id);
                // Czekamy na zakończenie synchronizacji z profilem, zanim
                // wypełnimy selektor — inaczej mógłby na chwilę (albo na
                // stałe, jeśli coś przerwie stronę) pokazać nieaktualną
                // wartość sprzed synchronizacji.
                await syncLanguageFromProfile(sb, session.user.id);
                populateLanguageSelect();
                document.getElementById('languageSelect').addEventListener('change', (e) => {
                    setLanguage(e.target.value, sb, session.user.id);
                    // setLanguage() sam odświeża napisy oznaczone data-i18n (przez
                    // applyTranslations()), ale komunikat o dacie kolejnej możliwej
                    // zmiany nazwy jest budowany ręcznie w JS (ma wstawioną datę), więc
                    // trzeba go świadomie przebudować w nowym języku — inaczej zostaje
                    // w starym aż do odświeżenia strony.
                    renderUsernameCooldown();
                });

                await syncThemeFromProfile(sb, session.user.id);
                document.getElementById('themeSelect').value = getCurrentTheme();
                document.getElementById('themeSelect').addEventListener('change', (e) => {
                    setTheme(e.target.value, sb, session.user.id);
                });

                // Nazwa użytkownika: jeśli konto (nowe albo już istniejące
                // sprzed wprowadzenia tej funkcji) jeszcze jej nie ma,
                // ustawiamy domyślną teraz (pierwszy człon e-maila przed
                // "@") — dzięki temu backfill dla starych kont dzieje się
                // sam przy najbliższym wejściu w ustawienia, bez osobnej
                // migracji dla każdego konta.
                await ensureDefaultUsername(sb, session.user.id, session.user.email);
                const usernameInput = document.getElementById('usernameInput');
                const usernameStatus = document.getElementById('usernameStatus');
                const saveUsernameBtn = document.getElementById('saveUsernameBtn');
                let usernameChangedAt = null;

                function renderUsernameCooldown() {
                    if (!usernameChangedAt) {
                        usernameStatus.innerText = '';
                        saveUsernameBtn.disabled = false;
                        return;
                    }
                    const nextChangeDate = new Date(usernameChangedAt);
                    nextChangeDate.setDate(nextChangeDate.getDate() + 14);
                    if (nextChangeDate > new Date()) {
                        usernameStatus.innerText = t('username_cooldown_note', { date: nextChangeDate.toLocaleDateString(getCurrentLanguage()) });
                        saveUsernameBtn.disabled = true;
                    } else {
                        usernameStatus.innerText = '';
                        saveUsernameBtn.disabled = false;
                    }
                }

                const { data: usernameProfile } = await sb.from('profiles').select('username, username_changed_at').eq('id', session.user.id).single();
                usernameInput.value = (usernameProfile && usernameProfile.username) || '';
                usernameChangedAt = usernameProfile && usernameProfile.username_changed_at;
                renderUsernameCooldown();

                saveUsernameBtn.addEventListener('click', async () => {
                    const newUsername = usernameInput.value.trim();
                    if (newUsername.length < 2 || newUsername.length > 24) {
                        usernameStatus.innerHTML = '<span class="status-err">' + t('err_username_length') + '</span>';
                        return;
                    }
                    if (containsForbiddenWord(newUsername)) {
                        usernameStatus.innerHTML = '<span class="status-err">' + t('err_username_forbidden') + '</span>';
                        return;
                    }
                    const { data, error } = await sb.from('profiles')
                        .update({ username: newUsername })
                        .eq('id', session.user.id)
                        .select('username_changed_at')
                        .single();
                    if (error) {
                        // Sprawdzenie w przeglądarce wyżej jest tylko wygodą — prawdziwe
                        // zabezpieczenie (nie do ominięcia) jest w bazie, w tym samym
                        // wyzwalaczu co limit "raz na 14 dni". Rozpoznajemy powód po
                        // kodzie/treści błędu z bazy, żeby pokazać właściwy komunikat.
                        let key = 'err_username_cooldown';
                        if (error.code === '23505') key = 'err_username_taken';
                        else if (error.message && error.message.includes('username_forbidden_word')) key = 'err_username_forbidden';
                        usernameStatus.innerHTML = '<span class="status-err">' + t(key) + '</span>';
                        return;
                    }
                    usernameChangedAt = data.username_changed_at;
                    renderUsernameCooldown();
                    if (!usernameStatus.innerText) {
                        usernameStatus.innerHTML = '<span class="status-ok">' + t('username_saved') + '</span>';
                    }
                    // Lustrzana kopia w metadanych logowania — używana przez Supabase
                    // do spersonalizowania maili wysyłanych automatycznie (np. przy
                    // odzyskiwaniu hasła), patrz PRAGMA_CONTEXT.md.
                    sb.auth.updateUser({ data: { username: newUsername } }).catch(() => {});
                });

                document.getElementById('accountEmail').innerText = session.user.email;
                document.getElementById('accountLoading').style.display = 'none';
                document.getElementById('accountContent').style.display = 'block';
            });

            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await sb.auth.signOut();
                window.location.href = 'index.html';
            });

            document.getElementById('changePasswordLink').addEventListener('click', (e) => {
                e.preventDefault();
                const form = document.getElementById('changePasswordForm');
                form.style.display = form.style.display === 'block' ? 'none' : 'block';
            });

            document.getElementById('changePasswordBtn').addEventListener('click', async () => {
                const statusEl = document.getElementById('accountStatus');
                const newPassword = document.getElementById('newPassword').value;
                if (!newPassword || newPassword.length < 6) {
                    statusEl.innerHTML = '<span class="status-err">' + t('err_password_min') + '</span>';
                    return;
                }
                try {
                    const { error } = await sb.auth.updateUser({ password: newPassword });
                    if (error) throw error;
                    statusEl.innerHTML = '<span class="status-ok">' + t('password_changed') + '</span>';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('changePasswordForm').style.display = 'none';
                    // Powiadomienie e-mail o zmianie hasła NIE jest już wywoływane stąd —
                    // Supabase ma do tego wbudowaną funkcję (Authentication → Emails →
                    // "Password changed"), znalezioną PO zbudowaniu własnej funkcji
                    // notify-password-changed. Wywoływanie obu naraz wysyłałoby dwa maile.
                    // Funkcja notify-password-changed została w repo (nieszkodliwa,
                    // niewywoływana) na wypadek, gdyby ta wbudowana opcja miała się okazać
                    // niewystarczająca — patrz PRAGMA_CONTEXT.md.
                } catch (err) {
                    statusEl.innerHTML = '<span class="status-err">' + translateAuthError(err) + '</span>';
                }
            });
        }
    </script>
</body>
</html>
