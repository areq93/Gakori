<!DOCTYPE html>
<html lang="pl">
<head>
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('gakori_theme') || 'light');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gakori - Twoje prywatne analizy</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="shortcut icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#2b2a27">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="gakori-brand">
        <h1 class="gakori-wordmark">
            <span class="gakori-shine-text">Gakori</span>
        </h1>
    </header>

    <!-- Ten sam górny pasek co account.html — ta strona ZAWSZE wymaga
         zalogowania (patrz getSession() niżej), więc pasek jest zawsze
         widoczny, bez ukrywania jak na scan.html (tamta strona jest
         publiczna, ta nie). -->
    <a id="userMenuBtn" href="account.html" style="display:flex;" data-i18n-aria-label="account_aria_label" aria-label="Twoje konto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
    <div id="creditBalance" class="credit-balance" style="display:flex;" data-i18n-aria-label="credit_balance_label" aria-label="Stan kredytów">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg><span id="creditBalanceValue" aria-live="polite">0</span>
    </div>

    <div class="card" style="max-width:480px; width:100%;">
        <a href="account.html" class="back-link" data-i18n="history_back">← Wróć do konta</a>
        <h2 data-i18n="history_title">Twoje prywatne analizy</h2>
        <p style="color:var(--ink-soft); font-size:13.5px; margin:0 0 14px 0;" data-i18n="history_intro">Tylko Ty widzisz tę listę — te analizy nie są publiczne.</p>

        <div id="historyLoading">
            <p style="color:var(--ink-soft); margin:0;" data-i18n="loading">Ładowanie...</p>
        </div>

        <div id="historyContent" style="display:none;">
            <div id="historySectionPdf" style="display:none;">
                <h3 class="history-section-title" data-i18n="history_section_pdf">PDF-y</h3>
                <div id="historyListPdf"></div>
            </div>
            <div id="historySectionImage" style="display:none;">
                <h3 class="history-section-title" data-i18n="history_section_image">Obrazy</h3>
                <div id="historyListImage"></div>
            </div>
            <div id="historySectionText" style="display:none;">
                <h3 class="history-section-title" data-i18n="history_section_text">Prywatne teksty</h3>
                <div id="historyListText"></div>
            </div>
        </div>
        <p id="historyEmpty" style="display:none; text-align:center; color:var(--ink-soft);" data-i18n="history_empty">Nie masz jeszcze żadnych prywatnych analiz.</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="i18n.js"></script>
    <script>
        applyTranslations();

        const SUPABASE_URL = 'https://daulljwdoerclborpctb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IitZfwgddsrCIo3iepG0Fg_CVqN-GBd';

        let sb = null;
        try {
            if (typeof supabase === 'undefined') throw new Error('Biblioteka Supabase nie wczytała się.');
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error(e);
        }

        if (!sb) {
            document.getElementById('historyLoading').innerHTML =
                '<p class="status-err">' + t('account_load_error') + '</p>';
        } else {
            // Tak jak account.html — ta strona wymaga zalogowania, bo bez
            // konta i tak nie ma żadnej prywatnej historii do pokazania.
            sb.auth.onAuthStateChange((event, session) => {
                if (!session) {
                    window.location.href = 'index.html';
                }
            });

            sb.auth.getSession().then(async ({ data: { session } }) => {
                if (!session) {
                    window.location.href = 'index.html';
                    return;
                }
                refreshCreditBalance(sb, session.user.id);

                // `scan_access` (widoczne tylko dla właściciela, patrz RLS w
                // GAKORI_CONTEXT.md) trzyma nazwę pliku i moment ostatniego
                // dostępu; dociągamy powiązany wynik (`scans`) przez wbudowane
                // złączenie PostgREST — RLS na `scans` i tak pozwoli tu tylko
                // na wiersze, do których ten użytkownik ma wpis w scan_access,
                // więc to złączenie nie ujawnia nic więcej niż zapytanie samo
                // w sobie już pozwala. POPRAWKA 2026-08-28(g) — `scan_access`
                // trzyma teraz też obrazy (zawsze prywatne) i teksty oznaczone
                // jako prywatne (`is_private`, patrz analyze/index.ts) — jedno
                // zapytanie, rozdzielone niżej na trzy sekcje po
                // `scans.input_type`.
                const { data, error } = await sb
                    .from('scan_access')
                    .select('scan_id, source_filename, created_at, scans(result, input_type, text_content)')
                    .eq('user_id', session.user.id)
                    .order('created_at', { ascending: false })
                    .limit(100);

                document.getElementById('historyLoading').style.display = 'none';

                if (error || !data || data.length === 0) {
                    document.getElementById('historyEmpty').style.display = 'block';
                    return;
                }

                const dateFmt = new Intl.DateTimeFormat(getCurrentLanguage(), { dateStyle: 'medium', timeStyle: 'short' });

                // Buduje jeden wiersz listy (wspólny dla PDF/obrazu/tekstu) —
                // różni się tylko ikoną i sposobem wyznaczenia etykiety.
                function buildRow(row, icon, labelText) {
                    const r = (row.scans && row.scans.result) || {};
                    const score = r.q_score;
                    let badgeClass = 'badge-red', label = (typeof score === 'number' ? score : '?') + '/100';
                    if (score >= 70) badgeClass = 'badge-green';
                    else if (score >= 40) badgeClass = 'badge-yellow';

                    const link = document.createElement('a');
                    link.className = 'scan-row';
                    link.href = 'scan.html?id=' + encodeURIComponent(row.scan_id);

                    const iconEl = document.createElement('span');
                    iconEl.className = 'scan-row-icon';
                    iconEl.innerText = icon;
                    link.appendChild(iconEl);

                    const badge = document.createElement('span');
                    badge.className = 'result-badge ' + badgeClass;
                    badge.innerText = label;
                    link.appendChild(badge);

                    const snippet = document.createElement('span');
                    snippet.className = 'scan-row-snippet';
                    snippet.innerText = labelText + ' · ' + dateFmt.format(new Date(row.created_at));
                    link.appendChild(snippet);

                    const arrow = document.createElement('span');
                    arrow.className = 'scan-row-arrow';
                    arrow.innerText = '→';
                    link.appendChild(arrow);

                    return link;
                }

                const byType = { pdf: [], image: [], text: [] };
                data.forEach((row) => {
                    const type = row.scans && row.scans.input_type;
                    if (byType[type]) byType[type].push(row);
                });

                if (byType.pdf.length > 0) {
                    const listEl = document.getElementById('historyListPdf');
                    byType.pdf.forEach((row) => {
                        listEl.appendChild(buildRow(row, '📄', row.source_filename || t('history_unnamed_file')));
                    });
                    document.getElementById('historySectionPdf').style.display = 'block';
                }

                if (byType.image.length > 0) {
                    const listEl = document.getElementById('historyListImage');
                    byType.image.forEach((row) => {
                        listEl.appendChild(buildRow(row, '🖼️', row.source_filename || t('history_unnamed_image')));
                    });
                    document.getElementById('historySectionImage').style.display = 'block';
                }

                if (byType.text.length > 0) {
                    const listEl = document.getElementById('historyListText');
                    byType.text.forEach((row) => {
                        // Nie ma tu "nazwy pliku" (to wklejony tekst) — pokazujemy
                        // krótki fragment samej treści zamiast nazwy.
                        const raw = (row.scans && row.scans.text_content) || '';
                        const snippet = raw.length > 60 ? raw.slice(0, 60).trim() + '…' : raw;
                        listEl.appendChild(buildRow(row, '📝', snippet || t('history_unnamed_text')));
                    });
                    document.getElementById('historySectionText').style.display = 'block';
                }

                if (byType.pdf.length === 0 && byType.image.length === 0 && byType.text.length === 0) {
                    document.getElementById('historyEmpty').style.display = 'block';
                } else {
                    document.getElementById('historyContent').style.display = 'block';
                }
            });
        }
    </script>
</body>
</html>
