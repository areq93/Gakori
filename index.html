<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragma - Analiza</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="shortcut icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; background: #f4f4f9; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; font-family: inherit; }
        textarea { resize: vertical; min-height: 100px; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:disabled { background: #93c5fd; cursor: default; }

        .tabs { display: flex; gap: 6px; margin: 10px 0; }
        .tab-btn {
            flex: 1; padding: 10px 4px; font-size: 13px; font-weight: bold;
            background: #eef1f8; color: #555; border: 1px solid #dde2ee; border-radius: 6px;
            cursor: pointer; width: auto; margin: 0;
        }
        .tab-btn.active { background: #2563eb; color: white; border-color: #2563eb; }

        .mode-panel { display: none; }
        .mode-panel.active { display: block; }

        #imagePreview { max-width: 100%; border-radius: 6px; margin-top: 8px; display: none; }
        #fileName { font-size: 13px; color: #666; margin-top: 4px; }

        /* Karta wyniku */
        .result-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; margin-top: 16px; box-sizing: border-box; display: none; }
        .result-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 14px; }
        .badge-green { background: #dcfce7; color: #166534; }
        .badge-yellow { background: #fef9c3; color: #854d0e; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .result-quote { border-left: 3px solid #2563eb; padding-left: 12px; margin: 0 0 14px 0; font-style: italic; color: #555; line-height: 1.4; }
        .result-summary { margin: 0; line-height: 1.5; }

        /* Panel debugowania */
        #debug { margin-top: 20px; padding: 10px; background: #eee; border-radius: 5px; font-size: 11px; width: 100%; max-width: 400px; white-space: pre-wrap; word-break: break-all; border: 1px dashed #ccc; box-sizing: border-box; }
        .status-ok { color: green; font-weight: bold; }
        .status-err { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h1 style="margin-top:0">Pragma</h1>

        <div class="tabs">
            <button class="tab-btn active" data-mode="url">🔗 Link</button>
            <button class="tab-btn" data-mode="text">📝 Tekst</button>
            <button class="tab-btn" data-mode="image">🖼️ Obraz</button>
        </div>

        <div class="mode-panel active" id="panel-url">
            <p>Wklej link do analizy:</p>
            <input type="url" id="urlInput" placeholder="https://...">
        </div>

        <div class="mode-panel" id="panel-text">
            <p>Wklej tekst do analizy:</p>
            <textarea id="textInput" placeholder="Wklej treść, którą chcesz przeanalizować..."></textarea>
        </div>

        <div class="mode-panel" id="panel-image">
            <p>Wybierz zdjęcie do analizy:</p>
            <input type="file" id="imageInput" accept="image/*">
            <div id="fileName"></div>
            <img id="imagePreview" alt="podgląd">
        </div>

        <button id="analyzeBtn">Analizuj</button>
        <div id="status" style="margin-top:10px"></div>
    </div>

    <div id="resultCard" class="result-card">
        <div id="resultBadge" class="result-badge"></div>
        <blockquote id="resultQuote" class="result-quote"></blockquote>
        <p id="resultSummary" class="result-summary"></p>
    </div>

    <div id="debug">
        <strong>Status PWA:</strong>
        <div id="sw-status">Sprawdzanie Service Workera...</div>
        <hr>
        <strong>Otrzymane dane (Share Target):</strong>
        <div id="share-data">Brak danych z udostępniania.</div>
        <hr>
        <strong>Ostatnia odpowiedź serwera:</strong>
        <div id="payload-data">Brak.</div>
    </div>

    <script>
        // ===== KONFIGURACJA POŁĄCZENIA Z BACKENDEM =====
        const SUPABASE_FUNCTION_URL = 'https://daulljwdoerclborpctb.supabase.co/functions/v1/analyze';
        const SUPABASE_ANON_KEY = 'sb_publishable_IitZfwgddsrCIo3iepG0Fg_CVqN-GBd'; // Project Settings -> API Keys -> Publishable key

        // 1. Rejestracja Service Workera i debugowanie
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js?v=2')
                .then(reg => {
                    document.getElementById('sw-status').innerHTML = '<span class="status-ok">✅ SW zarejestrowany!</span>';
                })
                .catch(err => {
                    document.getElementById('sw-status').innerHTML = '<span class="status-err">❌ Błąd SW: ' + err + '</span>';
                });
        } else {
            document.getElementById('sw-status').innerHTML = '<span class="status-err">❌ Twoja przeglądarka nie wspiera PWA</span>';
        }

        // 2. Przechwytywanie udostępnionego URL (Share Target zawsze trafia w zakładkę "Link")
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const sharedUrl = params.get('url') || params.get('text') || params.get('title');

            if (sharedUrl) {
                document.getElementById('share-data').innerHTML = '<span class="status-ok">✅ Otrzymano: ' + sharedUrl + '</span>';

                const urlRegex = /(https?:\/\/[^\s]+)/g;
                const found = sharedUrl.match(urlRegex);
                document.getElementById('urlInput').value = found ? found[0] : sharedUrl;
                setMode('url');
            }
        });

        // 3. Przełączanie zakładek (Link / Tekst / Obraz)
        let currentMode = 'url';
        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            document.querySelectorAll('.mode-panel').forEach(panel => {
                panel.classList.toggle('active', panel.id === 'panel-' + mode);
            });
            const labels = { url: 'Analizuj stronę', text: 'Analizuj tekst', image: 'Analizuj obraz' };
            document.getElementById('analyzeBtn').innerText = labels[mode];
            document.getElementById('status').innerText = '';
            document.getElementById('resultCard').style.display = 'none';
        }
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => setMode(btn.dataset.mode));
        });

        // 4. Podgląd wybranego obrazu
        document.getElementById('imageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            const preview = document.getElementById('imagePreview');
            const fileNameEl = document.getElementById('fileName');
            if (!file) {
                preview.style.display = 'none';
                fileNameEl.innerText = '';
                return;
            }
            fileNameEl.innerText = file.name + ' (' + Math.round(file.size / 1024) + ' KB)';
            const reader = new FileReader();
            reader.onload = (ev) => {
                preview.src = ev.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        });

        // 5. Hashowanie SHA-256 (klucz do cache'u społecznościowego w Supabase)
        async function sha256Hex(buffer) {
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        // 6. Wyświetlenie wyniku (albo przyjaznego komunikatu, jeśli backend odmówił)
        function renderResult(data) {
            const card = document.getElementById('resultCard');
            const badge = document.getElementById('resultBadge');
            const quote = document.getElementById('resultQuote');
            const summary = document.getElementById('resultSummary');

            if (data.error) {
                card.style.display = 'block';
                badge.className = 'result-badge badge-yellow';
                badge.innerText = 'Info';
                quote.style.display = 'none';
                summary.innerText = data.message || 'Coś poszło nie tak. Spróbuj ponownie za chwilę.';
                return;
            }

            const score = data.result.q_score;
            let badgeClass = 'badge-red', label = 'Manipulacja: ' + score + '/100';
            if (score >= 70) { badgeClass = 'badge-green'; label = 'Czysty tekst: ' + score + '/100'; }
            else if (score >= 40) { badgeClass = 'badge-yellow'; label = 'Częściowo: ' + score + '/100'; }

            card.style.display = 'block';
            badge.className = 'result-badge ' + badgeClass;
            badge.innerText = label;
            quote.style.display = 'block';
            quote.innerText = '„' + data.result.source_quote + '"';
            summary.innerText = data.result.summary;
        }

        // 7. Przycisk analizy - buduje payload, wysyła do backendu, pokazuje wynik
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('status');
            const payloadEl = document.getElementById('payload-data');
            const btn = document.getElementById('analyzeBtn');

            if (SUPABASE_ANON_KEY === 'WKLEJ_TUTAJ_SWOJ_PUBLISHABLE_KEY') {
                alert('Zapomnieliśmy wkleić klucz Publishable Key w kodzie (SUPABASE_ANON_KEY) - zrób to najpierw w pliku index.html.');
                return;
            }

            let payload = null;

            try {
                if (currentMode === 'url') {
                    const url = document.getElementById('urlInput').value.trim();
                    if (!url) return alert('Wpisz link!');
                    const hash = await sha256Hex(new TextEncoder().encode(url));
                    payload = { input_type: 'url', content_hash: hash, source_url: url };

                } else if (currentMode === 'text') {
                    const text = document.getElementById('textInput').value.trim();
                    if (!text) return alert('Wklej jakiś tekst!');
                    const hash = await sha256Hex(new TextEncoder().encode(text));
                    payload = { input_type: 'text', content_hash: hash, char_count: text.length, text_content: text };

                } else if (currentMode === 'image') {
                    const file = document.getElementById('imageInput').files[0];
                    if (!file) return alert('Wybierz obraz!');
                    const buffer = await file.arrayBuffer();
                    const hash = await sha256Hex(buffer);
                    payload = { input_type: 'image', content_hash: hash, file_name: file.name, size_kb: Math.round(file.size / 1024) };
                }

                btn.disabled = true;
                statusEl.innerText = 'Analizuję...';
                document.getElementById('resultCard').style.display = 'none';

                const res = await fetch(SUPABASE_FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                        'apikey': SUPABASE_ANON_KEY
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                statusEl.innerText = '';
                payloadEl.innerText = JSON.stringify(data, null, 2);
                renderResult(data);

            } catch (err) {
                statusEl.innerHTML = '<span class="status-err">❌ Błąd: ' + err + '</span>';
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
