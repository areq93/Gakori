<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragma - Analiza</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="shortcut icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#241f18">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card" style="max-width:400px; width:100%;">
        <a href="index.html" class="back-link">← Wróć do Pragmy</a>

        <div id="scanLoading">
            <p style="color:var(--ink-soft); margin:0;">Ładowanie...</p>
        </div>

        <div id="scanNotFound" style="display:none;">
            <p class="status-err">Nie znaleziono takiej analizy.</p>
        </div>

        <div id="scanContent" style="display:none;">
            <p id="scanSource" style="display:none; margin:0 0 12px 0; font-size:14px;"></p>
            <div id="scanBadge" class="result-badge"></div>
            <blockquote id="scanQuote" class="result-quote"></blockquote>
            <p id="scanSummary" class="result-summary"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script>
        const SUPABASE_URL = 'https://daulljwdoerclborpctb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IitZfwgddsrCIo3iepG0Fg_CVqN-GBd';

        let sb = null;
        try {
            if (typeof supabase === 'undefined') throw new Error('Biblioteka Supabase nie wczytała się.');
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error(e);
        }

        if (!sb) {
            document.getElementById('scanLoading').innerHTML =
                '<p class="status-err">Nie udało się wczytać analizy (sprawdź połączenie z internetem i odśwież stronę).</p>';
        } else {
            const scanId = new URLSearchParams(window.location.search).get('id');

            function showNotFound() {
                document.getElementById('scanLoading').style.display = 'none';
                document.getElementById('scanNotFound').style.display = 'block';
            }

            if (!scanId) {
                showNotFound();
            } else {
                sb.from('scans')
                    .select('input_type, source_url, result')
                    .eq('id', scanId)
                    .maybeSingle()
                    .then(({ data, error }) => {
                        if (error || !data || !data.result) {
                            showNotFound();
                            return;
                        }
                        const r = data.result;
                        const score = r.q_score;
                        let badgeClass = 'badge-red', label = 'Manipulacja: ' + score + '/100';
                        if (score >= 70) { badgeClass = 'badge-green'; label = 'Czysty tekst: ' + score + '/100'; }
                        else if (score >= 40) { badgeClass = 'badge-yellow'; label = 'Częściowo: ' + score + '/100'; }

                        const icon = data.input_type === 'url' ? '🔗' : data.input_type === 'image' ? '🖼️' : '📝';
                        // Pokazujemy link tylko, gdy to naprawdę http(s) - chroni przed
                        // wstrzyknięciem np. "javascript:" jako "źródła" przez złośliwe dane.
                        const isSafeUrl = data.source_url && /^https?:\/\//i.test(data.source_url);
                        if (isSafeUrl) {
                            const sourceEl = document.getElementById('scanSource');
                            sourceEl.style.display = 'block';
                            sourceEl.innerText = icon + ' Źródło: ';
                            const link = document.createElement('a');
                            link.href = data.source_url;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer nofollow';
                            link.innerText = data.source_url;
                            sourceEl.appendChild(link);
                        }

                        const badge = document.getElementById('scanBadge');
                        badge.className = 'result-badge ' + badgeClass;
                        badge.innerText = label;

                        const quote = document.getElementById('scanQuote');
                        if (r.source_quote) {
                            quote.innerText = '„' + r.source_quote + '"';
                        } else {
                            quote.style.display = 'none';
                        }

                        document.getElementById('scanSummary').innerText = r.summary || '';

                        document.getElementById('scanLoading').style.display = 'none';
                        document.getElementById('scanContent').style.display = 'block';
                    });
            }
        }
    </script>
</body>
</html>
