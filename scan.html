<!DOCTYPE html>
<html lang="pl">
<head>
    <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('pragma_theme') || 'light');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pragma - Analiza</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="shortcut icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#241f18">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card" style="max-width:400px; width:100%;">
        <a href="index.html" class="back-link" data-i18n="account_back">← Wróć do Pragmy</a>

        <div id="scanLoading">
            <p style="color:var(--ink-soft); margin:0;" data-i18n="loading">Ładowanie...</p>
        </div>

        <div id="scanNotFound" style="display:none;">
            <p class="status-err" data-i18n="scan_not_found">Nie znaleziono takiej analizy.</p>
        </div>

        <div id="scanContent" style="display:none;">
            <img id="scanImage" alt="">
            <p id="scanImageNotice" class="image-not-saved-notice"></p>
            <p id="scanSource" class="scan-source-box" style="display:none;"></p>
            <details id="scanTextSource" class="scan-text-source" style="display:none;">
                <summary id="scanTextSourceSummary"></summary>
                <div id="scanTextSourceContent" class="scan-text-source-content"></div>
            </details>
            <div id="scanBadge" class="result-badge"></div>
            <div id="scanPatterns"></div>
            <div class="summary-block">
                <p class="summary-label" data-i18n="summary_label">Podsumowanie</p>
                <p id="scanSummary" class="result-summary"></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="i18n.js"></script>
    <script>
        applyTranslations();

        const SUPABASE_URL = 'https://daulljwdoerclborpctb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IitZfwgddsrCIo3iepG0Fg_CVqN-GBd';

        let sb = null;
        try {
            if (typeof supabase === 'undefined') throw new Error('Biblioteka Supabase nie wczytała się.');
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error(e);
        }

        if (!sb) {
            document.getElementById('scanLoading').innerHTML =
                '<p class="status-err">' + t('scan_load_error') + '</p>';
        } else {
            const scanId = new URLSearchParams(window.location.search).get('id');

            function showNotFound() {
                document.getElementById('scanLoading').style.display = 'none';
                document.getElementById('scanNotFound').style.display = 'block';
            }

            // Buduje pełny tekst źródłowy z delikatnie podświetlonymi fragmentami
            // dokładnie tam, gdzie w oryginale występuje cytat z listy wykrytych
            // wzorców (patrz pattern.quote) — żeby było widać, w którym miejscu
            // tekstu analiza się do czegoś odnosi. Kolor podświetlenia zależy od
            // typu wzorca (manipulacja/obserwacja), tak samo jak kolor odznaki i
            // lewej krawędzi karty wzorca niżej — to ta sama konwencja kolorów
            // w całej aplikacji, nie osobna. Zbudowane WYŁĄCZNIE przez
            // createTextNode/createElement (nigdy innerHTML) — treść pochodzi od
            // użytkownika (własnego albo cudzego, gdy ktoś ogląda cudzą publiczną
            // analizę), więc nie może trafić na stronę jako surowy HTML.
            // Mimo instrukcji w prompcie o dosłowności model (albo różnice w
            // oryginalnym tekście — np. podwójna spacja, którą model naturalnie
            // "wygładza" do pojedynczej) czasem sprawia, że dokładne dopasowanie
            // 1:1 nie zadziała. Ta funkcja buduje wersję tekstu, w której KAŻDY
            // ciąg białych znaków (spacje, podwójne spacje, tabulatory,
            // złamania linii) jest zamieniony na pojedynczą spację — razem z
            // mapą "indeks w znormalizowanym tekście → indeks w oryginale", żeby
            // po znalezieniu dopasowania dało się podświetlić właściwy fragment
            // PRAWDZIWEGO tekstu (z jego oryginalnymi spacjami), nie kopii.
            function normalizeWithMap(text) {
                let normalized = '';
                const map = [];
                let lastWasSpace = false;
                for (let i = 0; i < text.length; i++) {
                    const ch = text[i];
                    if (/\s/.test(ch)) {
                        if (!lastWasSpace) {
                            normalized += ' ';
                            map.push(i);
                            lastWasSpace = true;
                        }
                    } else {
                        normalized += ch;
                        map.push(i);
                        lastWasSpace = false;
                    }
                }
                return { normalized, map };
            }

            // Szuka cytatu w znormalizowanym (spacje + wielkość liter) tekście, a
            // jeśli i to zawiedzie — próbuje bez pierwszych 1-3 słów (model czasem
            // ucina wiodący spójnik/zaimek, np. "I gdy patrzę..." → "Gdy patrzę...",
            // mimo instrukcji o dosłowności). Zwraca [start, end] w ORYGINALNYM
            // tekście (przez fullMap) albo null.
            function findQuoteRange(quote, normFullLower, fullMap, fullLength) {
                const { normalized: normQuote } = normalizeWithMap(quote);
                const lowerNormQuote = normQuote.toLowerCase();
                const toOriginal = (normStart, normEndExclusive) => ({
                    start: fullMap[normStart],
                    end: normEndExclusive - 1 < fullMap.length ? fullMap[normEndExclusive - 1] + 1 : fullLength,
                });

                let idx = normFullLower.indexOf(lowerNormQuote);
                if (idx !== -1) return toOriginal(idx, idx + lowerNormQuote.length);

                const words = lowerNormQuote.split(' ');
                for (let skip = 1; skip <= 3 && skip < words.length; skip++) {
                    const shortened = words.slice(skip).join(' ');
                    if (shortened.length < 15) break; // zbyt krótki fragment nie ma sensu podświetlać
                    idx = normFullLower.indexOf(shortened);
                    if (idx !== -1) return toOriginal(idx, idx + shortened.length);
                }
                return null;
            }

            // quoteEntries: [{ quote: string, isReasoning: boolean }]
            function buildHighlightedText(fullText, quoteEntries) {
                const fragment = document.createDocumentFragment();
                let ranges = [];
                const { normalized: normFull, map: fullMap } = normalizeWithMap(fullText);
                const normFullLower = normFull.toLowerCase();
                quoteEntries.forEach(({ quote, isReasoning }) => {
                    if (!quote) return;
                    let matchedAny = false;
                    let from = 0;
                    let found;
                    while ((found = fullText.indexOf(quote, from)) !== -1) {
                        ranges.push({ start: found, end: found + quote.length, isReasoning });
                        from = found + quote.length;
                        matchedAny = true;
                    }
                    if (!matchedAny) {
                        const fuzzy = findQuoteRange(quote, normFullLower, fullMap, fullText.length);
                        if (fuzzy) ranges.push({ start: fuzzy.start, end: fuzzy.end, isReasoning });
                    }
                });
                if (!ranges.length) {
                    fragment.appendChild(document.createTextNode(fullText));
                    return fragment;
                }
                ranges.sort((a, b) => a.start - b.start || a.end - b.end);
                const merged = [ranges[0]];
                for (let i = 1; i < ranges.length; i++) {
                    const last = merged[merged.length - 1];
                    const cur = ranges[i];
                    if (cur.start >= last.end) {
                        merged.push(cur);
                    } else if (cur.isReasoning === last.isReasoning) {
                        last.end = Math.max(last.end, cur.end);
                    } else if (cur.end > last.end) {
                        // Rzadki przypadek: cytaty dwóch RÓŻNYCH typów nakładają się
                        // na siebie — przycinamy wcześniejszy, żeby uniknąć
                        // nieprawidłowego zagnieżdżania znaczników <mark>.
                        last.end = cur.start;
                        merged.push(cur);
                    }
                }
                let cursor = 0;
                merged.forEach(({ start, end, isReasoning }) => {
                    if (end <= start) return;
                    if (start > cursor) fragment.appendChild(document.createTextNode(fullText.slice(cursor, start)));
                    const mark = document.createElement('mark');
                    mark.className = 'source-highlight ' + (isReasoning ? 'source-highlight-reasoning' : 'source-highlight-manipulation');
                    mark.appendChild(document.createTextNode(fullText.slice(start, end)));
                    fragment.appendChild(mark);
                    cursor = end;
                });
                if (cursor < fullText.length) fragment.appendChild(document.createTextNode(fullText.slice(cursor)));
                return fragment;
            }

            if (!scanId) {
                showNotFound();
            } else {
                sb.from('scans')
                    .select('input_type, source_url, text_content, result')
                    .eq('id', scanId)
                    .maybeSingle()
                    .then(({ data, error }) => {
                        if (error || !data || !data.result) {
                            showNotFound();
                            return;
                        }
                        // Jeśli to WŁAŚNIE ta osoba przed chwilą przesłała ten obraz do
                        // analizy, index.html zostawił jego pomniejszoną miniaturę w
                        // sessionStorage (patrz index.html, sekcja 7) — pokazujemy ją tu,
                        // na górze, i od razu kasujemy: to jednorazowy podgląd, obraz
                        // nigdy nie trafia na serwer, więc nie da się go zobaczyć ponownie
                        // (np. po odświeżeniu strony albo z innego urządzenia/karty).
                        if (data.input_type === 'image') {
                            const previewKey = 'pragma_scan_image_' + scanId;
                            const preview = sessionStorage.getItem(previewKey);
                            if (preview) {
                                sessionStorage.removeItem(previewKey);
                                const imgEl = document.getElementById('scanImage');
                                imgEl.src = preview;
                                imgEl.style.display = 'block';
                                const noticeEl = document.getElementById('scanImageNotice');
                                noticeEl.innerText = t('image_not_saved_notice');
                                noticeEl.style.display = 'block';
                            }
                        }

                        const r = data.result;
                        const score = r.q_score;
                        let badgeClass = 'badge-red', label = t('badge_manipulation', { score: score });
                        if (score >= 70) { badgeClass = 'badge-green'; label = t('badge_clean', { score: score }); }
                        else if (score >= 40) { badgeClass = 'badge-yellow'; label = t('badge_partial', { score: score }); }

                        const icon = data.input_type === 'url' ? '🔗' : data.input_type === 'image' ? '🖼️' : '📝';
                        // Pokazujemy link tylko, gdy to naprawdę http(s) - chroni przed
                        // wstrzyknięciem np. "javascript:" jako "źródła" przez złośliwe dane.
                        const isSafeUrl = data.source_url && /^https?:\/\//i.test(data.source_url);
                        if (isSafeUrl) {
                            const sourceEl = document.getElementById('scanSource');
                            sourceEl.style.display = 'block';
                            sourceEl.innerText = icon + ' ' + t('scan_source_label');
                            const link = document.createElement('a');
                            link.href = data.source_url;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer nofollow';
                            link.innerText = data.source_url;
                            sourceEl.appendChild(link);
                        }

                        // Tekst wklejony ręcznie: pokazujemy go w całości, zwinięty,
                        // z delikatnie podświetlonymi fragmentami odpowiadającymi
                        // cytatom omówionym niżej — dokładnie w miejscu, gdzie
                        // faktycznie występują w oryginale (patrz buildHighlightedText).
                        if (data.input_type === 'text' && typeof data.text_content === 'string' && data.text_content) {
                            const quoteEntries = Array.isArray(r.patterns)
                                ? r.patterns
                                    .filter((p) => p.quote)
                                    .map((p) => ({ quote: p.quote, isReasoning: p.pattern_type === 'reasoning' }))
                                : (r.source_quote ? [{ quote: r.source_quote, isReasoning: false }] : []);
                            const textSourceEl = document.getElementById('scanTextSource');
                            document.getElementById('scanTextSourceSummary').innerText = icon + ' ' + t('scan_text_source_label');
                            document.getElementById('scanTextSourceContent').appendChild(
                                buildHighlightedText(data.text_content, quoteEntries)
                            );
                            textSourceEl.style.display = 'block';
                        }

                        const badge = document.getElementById('scanBadge');
                        badge.className = 'result-badge ' + badgeClass;
                        badge.innerText = label;

                        // Nowa struktura wyniku ma r.patterns (lista wielu wzorców), stara
                        // (już zcache'owane analizy sprzed tej zmiany) ma pojedynczy
                        // r.source_quote — obsługujemy oba warianty.
                        const patternsEl = document.getElementById('scanPatterns');
                        if (Array.isArray(r.patterns)) {
                            r.patterns.forEach(p => {
                                // Starsze, już zcache'owane analizy sprzed tej zmiany nie mają
                                // pattern_type/tip — domyślnie traktujemy je jako "manipulation"
                                // (tak było jedyne dostępne znaczenie przed wprowadzeniem drugiego typu).
                                const isReasoning = p.pattern_type === 'reasoning';
                                const item = document.createElement('div');
                                item.className = 'pattern-item ' + (isReasoning ? 'pattern-reasoning' : 'pattern-manipulation');

                                const header = document.createElement('div');
                                header.className = 'pattern-header';
                                const tag = document.createElement('span');
                                tag.className = 'pattern-tag';
                                tag.innerText = t(isReasoning ? 'pattern_tag_reasoning' : 'pattern_tag_manipulation');
                                header.appendChild(tag);
                                if (p.name) {
                                    const name = document.createElement('span');
                                    name.className = 'pattern-name';
                                    name.innerText = p.name;
                                    header.appendChild(name);
                                }
                                item.appendChild(header);

                                const quote = document.createElement('blockquote');
                                quote.className = 'result-quote';
                                quote.innerText = '„' + p.quote + '"';
                                item.appendChild(quote);
                                if (p.explanation) {
                                    const explanation = document.createElement('p');
                                    explanation.className = 'pattern-explanation';
                                    explanation.innerText = p.explanation;
                                    item.appendChild(explanation);
                                }
                                if (p.tip) {
                                    const tip = document.createElement('div');
                                    tip.className = 'pattern-tip';
                                    const tipLabel = document.createElement('span');
                                    tipLabel.className = 'pattern-tip-label';
                                    tipLabel.innerText = t('tip_label');
                                    tip.appendChild(tipLabel);
                                    const tipText = document.createElement('span');
                                    tipText.innerText = p.tip;
                                    tip.appendChild(tipText);
                                    item.appendChild(tip);
                                }
                                patternsEl.appendChild(item);
                            });
                        } else if (r.source_quote) {
                            const quote = document.createElement('blockquote');
                            quote.className = 'result-quote';
                            quote.innerText = '„' + r.source_quote + '"';
                            patternsEl.appendChild(quote);
                        }

                        document.getElementById('scanSummary').innerText = r.summary || '';

                        document.getElementById('scanLoading').style.display = 'none';
                        document.getElementById('scanContent').style.display = 'block';
                    });
            }
        }
    </script>
</body>
</html>
