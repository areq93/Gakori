    <script>
        applyTranslations();

        const SUPABASE_URL = 'https://daulljwdoerclborpctb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IitZfwgddsrCIo3iepG0Fg_CVqN-GBd';
        const SUPABASE_FUNCTION_URL = SUPABASE_URL + '/functions/v1/analyze';
        const REPORT_MISMATCH_FUNCTION_URL = SUPABASE_URL + '/functions/v1/report-link-mismatch';

        // Ten sam sposób liczenia hasha co w index.html (musi dać identyczny
        // wynik dla tego samego linku, żeby trafić w ten sam wiersz cache'u).
        async function sha256Hex(buffer) {
            const digest = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
        }

        let sb = null;
        try {
            if (typeof supabase === 'undefined') throw new Error('Biblioteka Supabase nie wczytała się.');
            sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error(e);
        }

        // POPRAWKA 2026-08-25(c) audytu bezpieczeństwa — patrz ten sam
        // mechanizm w index.html (runAnalysisRequest) po pełne
        // uzasadnienie. Jedna dodatkowa, cicha próba przy błędzie
        // platformy (502/503/504/sieć), NIGDY przy naszym własnym,
        // czystym błędzie JSON.
        async function fetchAnalyzeWithRetry(url, options, inputTypeForLogging) {
            let res;
            try {
                res = await fetch(url, options);
            } catch {
                res = null;
            }
            if (res && ![502, 503, 504].includes(res.status)) return res;
            if (sb) {
                sb.from('edge_function_retries').insert({ input_type: inputTypeForLogging || null }).then(() => {}, () => {});
            }
            await new Promise((resolve) => setTimeout(resolve, 1500));
            return fetch(url, options);
        }

        if (!sb) {
            document.getElementById('scanLoading').innerHTML =
                '<p class="status-err">' + t('scan_load_error') + '</p>';
        } else {
            // Pasek profilu/kredytów — niezależnie od reszty strony (nie
            // blokuje pokazania wyniku skanu), tylko dla zalogowanych.
            // `currentSession`/`sessionReady` są też potrzebne PRZED
            // zapytaniem do `scans` niżej: PDF-y są teraz prywatne (RLS
            // sprawdza auth.uid()), więc bez poczekania na sesję zapytanie
            // mogłoby polecieć bez tokenu zalogowanego użytkownika i
            // dostać "nie znaleziono" mimo że to WŁAŚCICIEL patrzy na
            // własny wynik.
            let currentSession = null;
            const sessionReady = sb.auth.getSession().then(({ data: { session } }) => {
                currentSession = session;
                if (session) {
                    document.getElementById('userMenuBtn').style.display = 'flex';
                    document.getElementById('creditBalance').style.display = 'flex';
                    refreshCreditBalance(sb, session.user.id);
                }
            });

            const scanId = new URLSearchParams(window.location.search).get('id');

            function showNotFound() {
                document.getElementById('scanLoading').style.display = 'none';
                document.getElementById('scanNotFound').style.display = 'block';
            }

            // Buduje pełny tekst źródłowy z delikatnie podświetlonymi fragmentami
            // dokładnie tam, gdzie w oryginale występuje cytat z listy wykrytych
            // wzorców (patrz pattern.quote) — żeby było widać, w którym miejscu
            // tekstu analiza się do czegoś odnosi. Kolor podświetlenia zależy od
            // typu wzorca (manipulacja/obserwacja), tak samo jak kolor odznaki i
            // lewej krawędzi karty wzorca niżej — to ta sama konwencja kolorów
            // w całej aplikacji, nie osobna. Zbudowane WYŁĄCZNIE przez
            // createTextNode/createElement (nigdy innerHTML) — treść pochodzi od
            // użytkownika (własnego albo cudzego, gdy ktoś ogląda cudzą publiczną
            // analizę), więc nie może trafić na stronę jako surowy HTML.
            // Niektóre teksty wklejone z zewnątrz (czaty AI, Notion, edytory
            // markdown) zawierają "udawane pogrubienie" — zamiast prawdziwego
            // formatowania to specjalne znaki Unicode wyglądające jak pogrubione
            // litery (np. „𝗧𝗿𝗲𝗮𝘁” zamiast zwykłego „Treat”), z bloku Mathematical
            // Alphanumeric Symbols. Model przy cytowaniu zwykle "prostuje" je z
            // powrotem do zwykłych liter — nawet mimo instrukcji o dosłowności,
            // bo to leży poza jego naturalnym sposobem generowania tekstu — więc
            // dopasowanie cytatu do takiego fragmentu inaczej by zawsze zawodziło.
            // Zwraca zwykłą literę/cyfrę dla znanych "stylizowanych" zakresów
            // (pogrubienie, kursywa, pogrubiona kursywa, bezszeryfowe, maszynowe)
            // albo null, jeśli znak nie należy do żadnego z nich.
            function foldStyledChar(codePoint) {
                if (codePoint === 0x210e) return 'h'; // wyjątek: kursywne "h" nie ma własnego miejsca w bloku
                const letterRanges = [
                    0x1d400, 0x1d41a, 0x1d434, 0x1d44e, 0x1d468, 0x1d482,
                    0x1d5a0, 0x1d5ba, 0x1d5d4, 0x1d5ee, 0x1d608, 0x1d622,
                    0x1d63c, 0x1d656, 0x1d670, 0x1d68a,
                ];
                const lowerBases = new Set([0x1d41a, 0x1d44e, 0x1d482, 0x1d5ba, 0x1d5ee, 0x1d622, 0x1d656, 0x1d68a]);
                for (const base of letterRanges) {
                    if (codePoint >= base && codePoint < base + 26) {
                        return String.fromCharCode((lowerBases.has(base) ? 97 : 65) + (codePoint - base));
                    }
                }
                const digitRanges = [0x1d7ce, 0x1d7d8, 0x1d7e2, 0x1d7ec, 0x1d7f6];
                for (const base of digitRanges) {
                    if (codePoint >= base && codePoint < base + 10) return String.fromCharCode(48 + (codePoint - base));
                }
                return null;
            }

            // Buduje wersję tekstu, w której KAŻDY ciąg białych znaków (spacje,
            // podwójne spacje, tabulatory, złamania linii) jest zamieniony na
            // pojedynczą spację, a "stylizowane" litery/cyfry (patrz
            // foldStyledChar wyżej) na zwykłe — razem z mapą "indeks w
            // znormalizowanym tekście → indeks w oryginale", żeby po znalezieniu
            // dopasowania dało się podświetlić właściwy fragment PRAWDZIWEGO
            // tekstu, nie kopii. Iteruje po punktach kodowych (nie jednostkach
            // UTF-16), bo stylizowane znaki Unicode zajmują dwie jednostki —
            // inaczej rozcięlibyśmy je w połowie.
            function normalizeWithMap(text) {
                let normalized = '';
                const map = [];
                let lastWasSpace = false;
                let i = 0;
                while (i < text.length) {
                    const codePoint = text.codePointAt(i);
                    const unitLength = codePoint > 0xffff ? 2 : 1;
                    const ch = String.fromCodePoint(codePoint);
                    if (/\s/.test(ch)) {
                        if (!lastWasSpace) {
                            normalized += ' ';
                            map.push(i);
                            lastWasSpace = true;
                        }
                    } else {
                        normalized += foldStyledChar(codePoint) || ch;
                        map.push(i);
                        lastWasSpace = false;
                    }
                    i += unitLength;
                }
                return { normalized, map };
            }

            // Szuka cytatu w znormalizowanym (spacje + wielkość liter) tekście, a
            // jeśli i to zawiedzie — próbuje bez pierwszych 1-3 słów (model czasem
            // ucina wiodący spójnik/zaimek, np. "I gdy patrzę..." → "Gdy patrzę...",
            // mimo instrukcji o dosłowności). Zwraca [start, end] w ORYGINALNYM
            // tekście (przez fullMap) albo null.
            function findQuoteRange(quote, normFullLower, fullMap, fullLength) {
                const { normalized: normQuote } = normalizeWithMap(quote);
                const lowerNormQuote = normQuote.toLowerCase();
                // "end" to początek NASTĘPNEGO znaku po dopasowaniu (albo koniec
                // tekstu) — nie "ostatni znak + 1", żeby nie rozciąć w połowie
                // dwuznakowego (surogatowego) znaku na granicy dopasowania.
                const toOriginal = (normStart, normEndExclusive) => ({
                    start: fullMap[normStart],
                    end: normEndExclusive < fullMap.length ? fullMap[normEndExclusive] : fullLength,
                });

                let idx = normFullLower.indexOf(lowerNormQuote);
                if (idx !== -1) return toOriginal(idx, idx + lowerNormQuote.length);

                // POPRAWKA 2026-08-25 — model czasem ucina długi cytat
                // wielokropkiem NA KOŃCU ("...", "…") zamiast podać go w
                // całości — sam wielokropek nigdy nie występuje dosłownie w
                // oryginalnym tekście, więc dopasowanie zawodziło całkowicie
                // (zgłoszone na żywo: cytat w karcie wzorca widoczny, ale
                // NIC nie podświetlone w źródle). Usuwamy końcowy
                // wielokropek i próbujemy dopasować to, co zostało, jako
                // PREFIKS — nie musi się kończyć dokładnie w tym miejscu w
                // oryginale.
                const trailingEllipsis = lowerNormQuote.match(/^(.*?)[.…]{1,3}\s*$/);
                if (trailingEllipsis && trailingEllipsis[1].length >= 15) {
                    idx = normFullLower.indexOf(trailingEllipsis[1]);
                    if (idx !== -1) return toOriginal(idx, idx + trailingEllipsis[1].length);
                }

                const words = lowerNormQuote.split(' ');
                for (let skip = 1; skip <= 3 && skip < words.length; skip++) {
                    const shortened = words.slice(skip).join(' ');
                    if (shortened.length < 15) break; // zbyt krótki fragment nie ma sensu podświetlać
                    idx = normFullLower.indexOf(shortened);
                    if (idx !== -1) return toOriginal(idx, idx + shortened.length);
                }
                return null;
            }

            // quoteEntries: [{ quote: string, isReasoning: boolean }]
            function buildHighlightedText(fullText, quoteEntries) {
                const fragment = document.createDocumentFragment();
                let ranges = [];
                const { normalized: normFull, map: fullMap } = normalizeWithMap(fullText);
                const normFullLower = normFull.toLowerCase();
                quoteEntries.forEach(({ quote, isReasoning }) => {
                    if (!quote) return;
                    let matchedAny = false;
                    let from = 0;
                    let found;
                    while ((found = fullText.indexOf(quote, from)) !== -1) {
                        ranges.push({ start: found, end: found + quote.length, isReasoning });
                        from = found + quote.length;
                        matchedAny = true;
                    }
                    if (!matchedAny) {
                        const fuzzy = findQuoteRange(quote, normFullLower, fullMap, fullText.length);
                        if (fuzzy) ranges.push({ start: fuzzy.start, end: fuzzy.end, isReasoning });
                    }
                });
                if (!ranges.length) {
                    fragment.appendChild(document.createTextNode(fullText));
                    return fragment;
                }
                ranges.sort((a, b) => a.start - b.start || a.end - b.end);
                const merged = [ranges[0]];
                for (let i = 1; i < ranges.length; i++) {
                    const last = merged[merged.length - 1];
                    const cur = ranges[i];
                    if (cur.start >= last.end) {
                        merged.push(cur);
                    } else if (cur.isReasoning === last.isReasoning) {
                        last.end = Math.max(last.end, cur.end);
                    } else if (cur.end > last.end) {
                        // Rzadki przypadek: cytaty dwóch RÓŻNYCH typów nakładają się
                        // na siebie — przycinamy wcześniejszy, żeby uniknąć
                        // nieprawidłowego zagnieżdżania znaczników <mark>.
                        last.end = cur.start;
                        merged.push(cur);
                    }
                }
                let cursor = 0;
                merged.forEach(({ start, end, isReasoning }) => {
                    if (end <= start) return;
                    if (start > cursor) fragment.appendChild(document.createTextNode(fullText.slice(cursor, start)));
                    const mark = document.createElement('mark');
                    mark.className = 'source-highlight ' + (isReasoning ? 'source-highlight-reasoning' : 'source-highlight-manipulation');
                    mark.appendChild(document.createTextNode(fullText.slice(start, end)));
                    fragment.appendChild(mark);
                    cursor = end;
                });
                if (cursor < fullText.length) fragment.appendChild(document.createTextNode(fullText.slice(cursor)));
                return fragment;
            }

            if (!scanId) {
                showNotFound();
            } else {
                sessionReady.then(() => sb.from('scans')
                    .select('input_type, source_url, text_content, result, is_manual_source, retracted, view_count')
                    .eq('id', scanId)
                    .maybeSingle())
                    .then(({ data, error }) => {
                        if (error || !data || !data.result) {
                            showNotFound();
                            return;
                        }
                        // Jeśli to WŁAŚNIE ta osoba przed chwilą przesłała te obrazy do
                        // analizy, index.html zostawił ich pomniejszone miniatury w
                        // sessionStorage jako tablicę JSON (patrz index.html, sekcja 7) —
                        // pokazujemy je tu, na górze, i od razu kasujemy: to jednorazowy
                        // podgląd, obrazy nigdy nie trafiają na serwer, więc nie da się
                        // ich zobaczyć ponownie (np. po odświeżeniu strony albo z innego
                        // urządzenia/karty).
                        if (data.input_type === 'image') {
                            const previewKey = 'gakori_scan_image_' + scanId;
                            const preview = sessionStorage.getItem(previewKey);
                            if (preview) {
                                sessionStorage.removeItem(previewKey);
                                let urls = [];
                                try {
                                    const parsed = JSON.parse(preview);
                                    urls = Array.isArray(parsed) ? parsed : [preview];
                                } catch {
                                    urls = [preview]; // wsteczna zgodność ze starym, pojedynczym formatem
                                }
                                urls = urls.filter(Boolean);
                                if (urls.length > 0) {
                                    const listEl = document.getElementById('scanImageList');
                                    urls.forEach((url) => {
                                        const imgEl = document.createElement('img');
                                        imgEl.src = url;
                                        imgEl.alt = '';
                                        listEl.appendChild(imgEl);
                                    });
                                    listEl.style.display = 'flex';
                                    const noticeEl = document.getElementById('scanImageNotice');
                                    noticeEl.innerText = t('image_not_saved_notice');
                                    noticeEl.style.display = 'block';
                                }
                            }
                        }

                        // Punkt C11 audytu bezpieczeństwa — przejrzystość kosztów.
                        // "Paragon" zostawiony przez index.html (patrz tamtejszy
                        // kod) — WYŁĄCZNIE dla osoby, która przed chwilą sama
                        // uruchomiła TĘ analizę, jednorazowy odczyt (tak jak
                        // miniatury obrazów wyżej). Ktoś inny otwierający ten sam
                        // link później nic tu nie zobaczy.
                        // POPRAWKA 2026-08-25(e) — na wyraźną prośbę właściciela
                        // pokazujemy TERAZ już WYŁĄCZNIE informację "za darmo — z
                        // pamięci" (trafienie w cache); ile kredytów kosztowała
                        // płatna analiza — świadomie NIE pokazujemy już wcale
                        // (zamiast tego stały licznik wyświetleń niżej).
                        const costKey = 'gakori_scan_cost_' + scanId;
                        const costRaw = sessionStorage.getItem(costKey);
                        if (costRaw) {
                            sessionStorage.removeItem(costKey);
                            try {
                                const costInfo = JSON.parse(costRaw);
                                if (costInfo.cached) {
                                    const costEl = document.getElementById('scanCostNotice');
                                    costEl.innerText = t('cost_free_cache_notice');
                                    costEl.style.display = 'block';
                                }
                            } catch {
                                // uszkodzony zapis — po prostu nie pokazujemy paragonu
                            }
                        }

                        // POPRAWKA 2026-08-25(e) — stały, zawsze widoczny licznik
                        // wyświetleń (nie jednorazowy "paragon" jak wyżej — to
                        // prawdziwa, publiczna liczba z bazy, ta sama dla każdego,
                        // kto otworzy ten link). Na wyraźną prośbę właściciela.
                        document.getElementById('scanViewCount').innerText =
                            t('scan_view_count', { count: data.view_count ?? 0 });

                        // Punkt B audytu bezpieczeństwa — treść automatycznie
                        // wycofana (patrz report-link-mismatch, GAKORI_CONTEXT.md).
                        // Sam wynik nadal jest widoczny (to nie usunięcie), tylko
                        // z wyraźnym ostrzeżeniem — backend już jej nie serwuje
                        // jako zaufanej odpowiedzi z cache'u/ratunku nowym pytającym.
                        if (data.retracted) {
                            const retractedEl = document.getElementById('scanRetractedNotice');
                            retractedEl.innerText = t('scan_retracted_notice');
                            retractedEl.style.display = 'block';
                        }

                        const r = data.result;
                        const score = r.q_score;
                        let badgeClass = 'badge-red', label = t('badge_manipulation', { score: score });
                        if (score >= 70) { badgeClass = 'badge-green'; label = t('badge_clean', { score: score }); }
                        else if (score >= 40) { badgeClass = 'badge-yellow'; label = t('badge_partial', { score: score }); }

                        // Pokazujemy link tylko, gdy to naprawdę http(s) - chroni przed
                        // wstrzyknięciem np. "javascript:" jako "źródła" przez złośliwe dane.
                        const isSafeUrl = data.source_url && /^https?:\/\//i.test(data.source_url);
                        // POPRAWKA 2026-08-21(c) — tryb "Tekst" z opcjonalnie
                        // podpiętym linkiem źródła (patrz analyze/index.ts) ma
                        // wyglądać TAK SAMO jak zwykły tryb "Link" — stąd 🔗
                        // zawsze, gdy jest bezpieczny link źródła, niezależnie
                        // od faktycznego input_type.
                        const icon = isSafeUrl ? '🔗' : data.input_type === 'image' ? '🖼️' : data.input_type === 'pdf' ? '📄' : '📝';
                        if (isSafeUrl) {
                            const sourceEl = document.getElementById('scanSource');
                            sourceEl.style.display = 'block';
                            sourceEl.innerText = icon + ' ' + t('scan_source_label');
                            const link = document.createElement('a');
                            link.href = data.source_url;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer nofollow';
                            link.innerText = data.source_url;
                            sourceEl.appendChild(link);
                        }

                        // Nazwa oryginalnego pliku PDF — żyje w `scan_access` (per
                        // użytkownik, nie w `scans` samym), bo dwie różne osoby mogły
                        // przesłać ten sam plik pod różnymi nazwami (patrz analyze/index.ts).
                        // Wymaga zalogowania — bez sesji ten wiersz i tak byłby
                        // niewidoczny dla RLS, więc nie ma sensu nawet pytać.
                        if (data.input_type === 'pdf' && currentSession) {
                            sb.from('scan_access')
                                .select('source_filename')
                                .eq('scan_id', scanId)
                                .eq('user_id', currentSession.user.id)
                                .maybeSingle()
                                .then(({ data: accessRow }) => {
                                    if (accessRow && accessRow.source_filename) {
                                        const sourceEl = document.getElementById('scanSource');
                                        sourceEl.style.display = 'block';
                                        sourceEl.innerText = icon + ' ' + t('scan_pdf_source_label');
                                        const nameSpan = document.createElement('span');
                                        nameSpan.innerText = accessRow.source_filename;
                                        sourceEl.appendChild(nameSpan);
                                    }
                                });
                        }

                        // Pełna analizowana treść: pokazujemy ją w całości, zwiniętą,
                        // z delikatnie podświetlonymi fragmentami odpowiadającymi
                        // cytatom omówionym niżej — dokładnie w miejscu, gdzie
                        // faktycznie występują w oryginale (patrz buildHighlightedText).
                        // POPRAWKA 2026-08-25 — dawniej WYŁĄCZNIE dla ręcznie wklejonego
                        // tekstu; od teraz też dla linku (backend zapisuje tam oczyszczoną
                        // treść pobraną ze strony, patrz analyze/index.ts) — pozwala
                        // sprawdzić, co dokładnie zobaczył Gemini, w obu trybach tak samo.
                        if (typeof data.text_content === 'string' && data.text_content) {
                            const quoteEntries = Array.isArray(r.patterns)
                                ? r.patterns
                                    .filter((p) => p.quote)
                                    .map((p) => ({ quote: p.quote, isReasoning: p.pattern_type === 'reasoning' }))
                                : (r.source_quote ? [{ quote: r.source_quote, isReasoning: false }] : []);
                            const textSourceEl = document.getElementById('scanTextSource');
                            // POPRAWKA 2026-08-26(c) — liczba znaków WPROST przy nagłówku
                            // panelu, licząc dokładnie z `data.text_content` (tej samej
                            // wartości, którą kopiuje przycisk "Kopiuj" i którą serwer
                            // zahaszował) — narzędzie diagnostyczne dla dokładnie tego
                            // problemu, co POPRAWKA 2026-08-26(b): pozwala PORÓWNAĆ na oko
                            // liczbę znaków dwóch "tej samej" analizy (link vs tekst) bez
                            // dostępu do bazy danych, żeby od razu było widać, czy to
                            // naprawdę identyczna treść, czy jednak nie.
                            document.getElementById('scanTextSourceSummary').innerText =
                                icon + ' ' + t('scan_text_source_label') + ' (' + t('scan_text_source_char_count', { count: data.text_content.length }) + ')';
                            document.getElementById('scanTextSourceContent').appendChild(
                                buildHighlightedText(data.text_content, quoteEntries)
                            );
                            textSourceEl.style.display = 'block';
                        }

                        // Punkt 5 audytu bezpieczeństwa — patrz GAKORI_CONTEXT.md,
                        // "Zaufanie do ręcznie wklejonych linków". Stała,
                        // widoczna informacja, nigdy nie znika — TYLKO dla treści
                        // faktycznie wklejonej ręcznie (byłoby mylące dla zwykłej,
                        // automatycznej analizy linku).
                        if (data.is_manual_source) {
                            document.getElementById('scanManualSourceNotice').innerText = t('manual_source_notice');
                        }
                        // POPRAWKA 2026-08-26(k) — te trzy przyciski (zgłoś
                        // niezgodność / sprawdź, czy coś się zmieniło / wklej
                        // własną treść) dawniej pokazywały się WYŁĄCZNIE dla
                        // treści wklejonej ręcznie — ale liczenie wyświetleń pod
                        // automatyczne wycofanie już dziś liczy się jednakowo dla
                        // wszystkich trybów, a "Sprawdź, czy coś się zmieniło"
                        // jest teraz bezpieczne (porównanie podobieństwa treści,
                        // darmowe gdy strona się nie zmieniła — patrz POPRAWKA
                        // 2026-08-26(j)) — więc rozszerzamy widoczność na KAŻDĄ
                        // analizę linku, nie tylko ręcznie wklejoną treść.
                        if (data.is_manual_source || (data.input_type === 'url' && typeof data.source_url === 'string')) {
                            document.getElementById('scanManualSourceBox').style.display = 'block';

                            const manualStatusEl = document.getElementById('scanManualSourceStatus');
                            document.getElementById('scanReportMismatchBtn').addEventListener('click', async () => {
                                if (!currentSession) {
                                    manualStatusEl.innerHTML = '<span class="status-err">' + t('err_signup_required') + '</span>';
                                    return;
                                }
                                try {
                                    const res = await fetch(REPORT_MISMATCH_FUNCTION_URL, {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json',
                                            'Authorization': 'Bearer ' + currentSession.access_token,
                                            'apikey': SUPABASE_ANON_KEY
                                        },
                                        body: JSON.stringify({ scan_id: scanId })
                                    });
                                    const resData = await res.json();
                                    manualStatusEl.innerHTML = resData.ok
                                        ? '<span class="status-ok">' + t('status_mismatch_reported') + '</span>'
                                        : '<span class="status-err">' + t('result_generic_error') + '</span>';
                                } catch {
                                    manualStatusEl.innerHTML = '<span class="status-err">' + t('result_generic_error') + '</span>';
                                }
                            });

                            // Punkt A4 audytu bezpieczeństwa — konkretne komunikaty
                            // błędów zamiast jednego uniwersalnego, ten sam wzorzec
                            // co errorMessageKeys w index.html (renderResult()).
                            const refreshErrorMessageKeys = {
                                signup_required: 'err_signup_required',
                                insufficient_credits: 'err_insufficient_credits',
                                url_fetch_failed: 'err_url_fetch_failed',
                                save_failed: 'err_save_failed',
                                system_paused: 'err_system_paused',
                            };
                            function showRefreshError(errorCode) {
                                const key = refreshErrorMessageKeys[errorCode];
                                manualStatusEl.innerHTML = '<span class="status-err">' + (key ? t(key) : t('result_generic_error')) + '</span>';
                            }

                            // "Sprawdź, czy coś się zmieniło" — zawsze przez tryb
                            // "Link" na `source_url` (niezależnie od tego, czy TEN
                            // konkretny wpis jest input_type 'text' czy 'url') —
                            // to jedyny sposób, żeby realnie sprawdzić, czy strona
                            // już daje się pobrać automatycznie. Zawsze świadomy,
                            // płatny wybór (patrz `forceRefresh` w analyze/index.ts).
                            // POPRAWKA 2026-08-23(a), punkt A — teraz DWUETAPOWO
                            // (tak jak PDF): najpierw darmowe sprawdzenie/pobranie i
                            // pokazanie realnej ceny, dopiero po wyraźnym "tak"
                            // druga, płatna prośba z `confirmed:true`. `refresh_scan_id`
                            // każe backendowi NADPISAĆ dokładnie TEN wiersz zamiast
                            // tworzyć duplikat w cache'u (patrz analyze/index.ts).
                            if (data.source_url && /^https?:\/\//i.test(data.source_url)) {
                                async function requestRefresh(confirmed) {
                                    const hash = await sha256Hex(new TextEncoder().encode(data.source_url));
                                    const authToken = currentSession ? currentSession.access_token : SUPABASE_ANON_KEY;
                                    const body = {
                                        input_type: 'url',
                                        content_hash: hash,
                                        source_url: data.source_url,
                                        language: getCurrentLanguage(),
                                        force_refresh: true,
                                        refresh_scan_id: scanId,
                                    };
                                    if (confirmed) body.confirmed = true;
                                    const res = await fetchAnalyzeWithRetry(SUPABASE_FUNCTION_URL, {
                                        method: 'POST',
                                        headers: {
                                            'Content-Type': 'application/json',
                                            'Authorization': 'Bearer ' + authToken,
                                            'apikey': SUPABASE_ANON_KEY
                                        },
                                        body: JSON.stringify(body)
                                    }, 'url');
                                    return res.json();
                                }
                                // POPRAWKA 2026-08-26(o) — druga, płatna prośba (confirmed:true)
                                // wysyłana teraz z kliknięcia "Tak, analizuj" na własnym
                                // ekranie zgody (#refreshConfirmOverlay), nie z domyślnego
                                // confirm() przeglądarki.
                                async function runConfirmedRefresh() {
                                    document.getElementById('refreshConfirmOverlay').style.display = 'none';
                                    manualStatusEl.innerHTML = '<span class="status-ok">' + t('status_please_wait') + '</span>';
                                    try {
                                        const confirmedData = await requestRefresh(true);
                                        if (confirmedData.id) {
                                            try {
                                                sessionStorage.setItem('gakori_scan_cost_' + confirmedData.id, JSON.stringify({ cost: confirmedData.cost, cached: !!confirmedData.cached }));
                                            } catch {
                                                // limit sessionStorage — pomijamy "paragon"
                                            }
                                            window.location.href = 'scan.html?id=' + confirmedData.id;
                                        } else {
                                            showRefreshError(confirmedData.error);
                                        }
                                    } catch {
                                        manualStatusEl.innerHTML = '<span class="status-err">' + t('result_generic_error') + '</span>';
                                    }
                                }
                                document.getElementById('refreshConfirmYes').addEventListener('click', runConfirmedRefresh);
                                document.getElementById('refreshConfirmNo').addEventListener('click', (e) => {
                                    e.preventDefault();
                                    document.getElementById('refreshConfirmOverlay').style.display = 'none';
                                });
                                document.getElementById('scanForceRefreshBtn').addEventListener('click', async () => {
                                    manualStatusEl.innerHTML = '<span class="status-ok">' + t('status_please_wait') + '</span>';
                                    try {
                                        const resData = await requestRefresh(false);
                                        if (resData.needs_confirmation) {
                                            manualStatusEl.innerText = '';
                                            // Punkt C audytu bezpieczeństwa — pokazujemy też, na jakiej
                                            // podstawie (ile znaków) wyliczona jest cena, ten sam wzorzec
                                            // co w index.html (showPdfConfirm).
                                            if (typeof resData.char_count === 'number') {
                                                document.getElementById('refreshConfirmCharCount').innerText = t('url_confirm_char_count', { count: resData.char_count });
                                                document.getElementById('refreshConfirmCleanNotice').innerText = t('url_confirm_clean_notice');
                                            } else {
                                                document.getElementById('refreshConfirmCharCount').innerText = '';
                                                document.getElementById('refreshConfirmCleanNotice').innerText = '';
                                            }
                                            document.getElementById('refreshConfirmCost').innerText = t('pdf_confirm_cost', { cost: resData.estimated_cost });
                                            document.getElementById('refreshConfirmOverlay').style.display = 'flex';
                                        } else if (resData.id) {
                                            window.location.href = 'scan.html?id=' + resData.id;
                                        } else {
                                            showRefreshError(resData.error);
                                        }
                                    } catch {
                                        manualStatusEl.innerHTML = '<span class="status-err">' + t('result_generic_error') + '</span>';
                                    }
                                });

                                // Punkt A3 audytu bezpieczeństwa — zamiast czekać na
                                // (płatne) automatyczne sprawdzenie, użytkownik może
                                // od razu wkleić własną, świeżą treść w trybie "Tekst"
                                // z tym samym linkiem źródła już wpisanym — patrz
                                // obsługa `prefill_text_source` w index.html.
                                document.getElementById('scanPasteOwnContentBtn').addEventListener('click', () => {
                                    window.location.href = 'index.html?prefill_text_source=' + encodeURIComponent(data.source_url);
                                });
                            } else {
                                document.getElementById('scanForceRefreshBtn').style.display = 'none';
                                document.getElementById('scanPasteOwnContentBtn').style.display = 'none';
                            }
                        }

                        const badge = document.getElementById('scanBadge');
                        badge.className = 'result-badge ' + badgeClass;
                        badge.innerText = label;

                        // Nowa struktura wyniku ma r.patterns (lista wielu wzorców), stara
                        // (już zcache'owane analizy sprzed tej zmiany) ma pojedynczy
                        // r.source_quote — obsługujemy oba warianty.
                        const patternsEl = document.getElementById('scanPatterns');
                        if (Array.isArray(r.patterns)) {
                            // Najwyższy numer obrazu w całej liście — mówi nam, czy w ogóle
                            // był to zestaw WIELU obrazów naraz (patrz odznaka niżej).
                            const maxImageIndex = r.patterns.reduce((max, p) => typeof p.image_index === 'number' && p.image_index > max ? p.image_index : max, 0);

                            // POPRAWKA 2026-08-21(a) — ten sam model bywa wykryty wielokrotnie
                            // w różnych miejscach długiego tekstu (typowo PDF, wiele stron) —
                            // płaska lista wyglądała wtedy jak "śmietnik" z powtarzającymi się
                            // nazwami (zgłoszone przez właściciela). Grupujemy więc wzorce o
                            // TEJ SAMEJ nazwie w jeden, zwijany "folder" — wszystkie wystąpienia
                            // lądują w środku, jedno pod drugim, zamiast rozrzucone po całej
                            // liście. Nazwa bez wartości (stare, zcache'owane analizy sprzed
                            // pola "name") dostaje unikalny klucz per element, żeby przypadkiem
                            // nie zlepić niepowiązanych wzorców w jedną grupę.
                            const groups = [];
                            const groupIndexByName = new Map();
                            r.patterns.forEach((p, idx) => {
                                const key = p.name || ('__unnamed_' + idx);
                                if (groupIndexByName.has(key)) {
                                    groups[groupIndexByName.get(key)].items.push(p);
                                } else {
                                    groupIndexByName.set(key, groups.length);
                                    groups.push({ name: p.name || '', items: [p] });
                                }
                            });

                            // Dopisuje treść JEDNEGO wystąpienia wzorca (opcjonalnie odznaka
                            // strony/obrazu, cytat, wyjaśnienie, podpowiedź) do podanego
                            // kontenera — wspólne dla pojedynczej karty i dla każdego elementu
                            // wewnątrz folderu, żeby nie duplikować tego samego kodu. Odznaka
                            // strony/obrazu jest pomijana dla pojedynczej karty (tam ląduje w
                            // nagłówku, patrz niżej) i dołączana dla każdego wystąpienia w
                            // folderze (tam nagłówek jest wspólny dla wszystkich, więc odznaka
                            // musi być przy każdym elemencie z osobna).
                            function fillInstanceContent(container, p, includeBadge) {
                                if (includeBadge && data.input_type === 'pdf' && typeof p.page === 'number') {
                                    const pageBadge = document.createElement('span');
                                    pageBadge.className = 'pattern-page';
                                    pageBadge.innerText = t('pattern_page_label', { page: p.page });
                                    container.appendChild(pageBadge);
                                }
                                if (includeBadge && data.input_type === 'image' && typeof p.image_index === 'number' && maxImageIndex > 1) {
                                    const imageBadge = document.createElement('span');
                                    imageBadge.className = 'pattern-page';
                                    imageBadge.innerText = t('pattern_image_label', { index: p.image_index });
                                    container.appendChild(imageBadge);
                                }
                                const quote = document.createElement('blockquote');
                                quote.className = 'result-quote';
                                quote.innerText = '„' + p.quote + '"';
                                container.appendChild(quote);
                                if (p.explanation) {
                                    const explanation = document.createElement('p');
                                    explanation.className = 'pattern-explanation';
                                    explanation.innerText = p.explanation;
                                    container.appendChild(explanation);
                                }
                                if (p.tip) {
                                    const tip = document.createElement('div');
                                    tip.className = 'pattern-tip';
                                    const tipLabel = document.createElement('span');
                                    tipLabel.className = 'pattern-tip-label';
                                    tipLabel.innerText = t('tip_label');
                                    tip.appendChild(tipLabel);
                                    const tipText = document.createElement('span');
                                    tipText.className = 'pattern-tip-text';
                                    tipText.innerText = p.tip;
                                    tip.appendChild(tipText);
                                    container.appendChild(tip);
                                }
                            }

                            // Karty da się rozwijać/zwijać niezależnie od siebie (patrz
                            // POPRAWKA 2026-08-20(e)) — WYŁĄCZNIE pierwsza jest domyślnie
                            // rozwinięta, reszta czeka zwinięta, każda kliknięta osobno, bez
                            // wpływu na pozostałe (nie akordeon).
                            function attachToggle(item, header, expandedByDefault) {
                                header.setAttribute('role', 'button');
                                header.setAttribute('tabindex', '0');
                                const setExpanded = (expanded) => {
                                    item.classList.toggle('collapsed', !expanded);
                                    header.setAttribute('aria-expanded', expanded ? 'true' : 'false');
                                };
                                setExpanded(expandedByDefault);
                                header.addEventListener('click', () => setExpanded(item.classList.contains('collapsed')));
                                header.addEventListener('keydown', (e) => {
                                    if (e.key === 'Enter' || e.key === ' ') {
                                        e.preventDefault();
                                        setExpanded(item.classList.contains('collapsed'));
                                    }
                                });
                            }

                            groups.forEach((group, groupIndex) => {
                                const first = group.items[0];
                                // Starsze, już zcache'owane analizy sprzed tej zmiany nie mają
                                // pattern_type/tip — domyślnie traktujemy je jako "manipulation"
                                // (tak było jedyne dostępne znaczenie przed wprowadzeniem drugiego typu).
                                const isReasoning = first.pattern_type === 'reasoning';
                                const isFolder = group.items.length > 1;
                                const item = document.createElement('div');
                                item.className = 'pattern-item ' + (isReasoning ? 'pattern-reasoning' : 'pattern-manipulation') + (isFolder ? ' pattern-folder' : '');

                                const header = document.createElement('div');
                                header.className = 'pattern-header';

                                const tag = document.createElement('span');
                                tag.className = 'pattern-tag';
                                tag.innerText = t(isReasoning ? 'pattern_tag_reasoning' : 'pattern_tag_manipulation');
                                header.appendChild(tag);
                                if (group.name) {
                                    const name = document.createElement('span');
                                    name.className = 'pattern-name';
                                    name.innerText = group.name;
                                    header.appendChild(name);
                                }
                                if (isFolder) {
                                    // Liczba wystąpień tego samego modelu — "×4" jest zrozumiałe
                                    // bez tłumaczenia w każdym z 10 obsługiwanych języków.
                                    const countBadge = document.createElement('span');
                                    countBadge.className = 'pattern-page pattern-count';
                                    countBadge.innerText = '×' + group.items.length;
                                    header.appendChild(countBadge);
                                } else {
                                    // Numer strony — tylko PDF-y mają wiele stron, więc tylko
                                    // tam Gemini w ogóle wypełnia to pole (patrz PDF_RESPONSE_SCHEMA
                                    // w analyze/index.ts). Bez tego czytelnik nie wiedziałby, gdzie
                                    // w wielostronicowym dokumencie szukać danego cytatu.
                                    if (data.input_type === 'pdf' && typeof first.page === 'number') {
                                        const pageBadge = document.createElement('span');
                                        pageBadge.className = 'pattern-page';
                                        pageBadge.innerText = t('pattern_page_label', { page: first.page });
                                        header.appendChild(pageBadge);
                                    }
                                    // Numer obrazu — tylko gdy przesłano więcej niż jeden naraz
                                    // (każdy obraz ma teraz własne, osobne zapytanie do Gemini,
                                    // patrz POPRAWKA 2026-08-19(e) w analyze/index.ts), inaczej
                                    // odznaka "Obraz 1" przy pojedynczym obrazie byłaby zbędnym szumem.
                                    if (data.input_type === 'image' && typeof first.image_index === 'number' && maxImageIndex > 1) {
                                        const imageBadge = document.createElement('span');
                                        imageBadge.className = 'pattern-page';
                                        imageBadge.innerText = t('pattern_image_label', { index: first.image_index });
                                        header.appendChild(imageBadge);
                                    }
                                }
                                const chevron = document.createElement('span');
                                chevron.className = 'pattern-chevron';
                                chevron.setAttribute('aria-hidden', 'true');
                                chevron.innerText = '▾';
                                header.appendChild(chevron);
                                item.appendChild(header);

                                const body = document.createElement('div');
                                body.className = 'pattern-body';
                                if (isFolder) {
                                    group.items.forEach((p) => {
                                        const instance = document.createElement('div');
                                        instance.className = 'pattern-instance';
                                        fillInstanceContent(instance, p, true);
                                        body.appendChild(instance);
                                    });
                                } else {
                                    fillInstanceContent(body, first, false);
                                }
                                item.appendChild(body);

                                attachToggle(item, header, groupIndex === 0);
                                patternsEl.appendChild(item);
                            });
                        } else if (r.source_quote) {
                            const quote = document.createElement('blockquote');
                            quote.className = 'result-quote';
                            quote.innerText = '„' + r.source_quote + '"';
                            patternsEl.appendChild(quote);
                        }

                        document.getElementById('scanSummary').innerText = r.summary || '';

                        document.getElementById('scanLoading').style.display = 'none';
                        document.getElementById('scanContent').style.display = 'block';
                    });
            }
        }
    </script>
</body>
</html>
